---
include:
# - docker-compose-acme.yml # uncomment this line to use it
# - docker-compose-pgadmin.yml # uncomment this line to use it

# define envs for logic containers
x-policyclue-envs: &policyclue_envs
  DATABASE_URL: postgresql+psycopg2://pclue:${PCLUE_DB_PW:?error}@db:5432/policycluedb

  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:?error}

  PCLUE_PORTAL_URL: ${PCLUE_PORTAL_URL:?error}
  PCLUE_ONPREMISE: ${PCLUE_ONPREMISE:-0}
  PCLUE_SECRET: ${PCLUE_SECRET:?error}
  PCLUE_SESSION_TIMEOUT: ${PCLUE_SESSION_TIMEOUT:-10800}

  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT}
  MAIL_SECURITY: ${MAIL_SECURITY:-tls}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}

  MSENTRA_CLIENT_ID: ${MSENTRA_CLIENT_ID}
  MSENTRA_CLIENT_SECRET: ${MSENTRA_CLIENT_SECRET}
  MSENTRA_TENANT_ID: ${MSENTRA_TENANT_ID}

  KS_LICENSE: ${KS_LICENSE}

  CAPE_API_URL: ${CAPE_API_URL:-}
  CAPE_API_TOKEN: ${CAPE_API_TOKEN:-}

  WORKER_SLEEP_INTERVAL: ${WORKER_SLEEP_INTERVAL:-21600}

  TZ: ${TIMEZONE:-Europe/Zurich}

  # PostgreSQL connection-pool tuning
  DB_ASYNC_POOL_SIZE: ${DB_ASYNC_POOL_SIZE:-30}
  DB_ASYNC_MAX_OVERFLOW: ${DB_ASYNC_MAX_OVERFLOW:-60}
  DB_SYNC_POOL_SIZE: ${DB_SYNC_POOL_SIZE:-2}
  DB_SYNC_MAX_OVERFLOW: ${DB_SYNC_MAX_OVERFLOW:-3}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}

  DEBUG: 0

# define global settings for all swissp containers
x-policyclue-defaults: &policyclue_defaults
  image: registry.khost.ch/policyclue/api:latest
  restart: unless-stopped
  environment:
    <<: *policyclue_envs
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
    - /var/tmp
  volumes:
    - pclue-files:/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  stop_grace_period: 30s

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.6
    container_name: elasticsearch
    restart: unless-stopped
    networks:
      - backend
    environment:
      discovery.type: single-node
      xpack.security.enabled: true
      xpack.security.http.ssl.enabled: false
      xpack.security.transport.ssl.enabled: false
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?error}
      ES_JAVA_OPTS: -Xms${ES_HEAP_SIZE:-1g} -Xmx${ES_HEAP_SIZE:-1g}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ES needs write access to its data dir; keep container R/W
    read_only: false
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:$$ELASTIC_PASSWORD http://localhost:9200 >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 30
  db:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    networks:
      - backend
    environment:
      POSTGRES_DB: policycluedb
      POSTGRES_USER: pclue
      POSTGRES_PASSWORD: ${PCLUE_DB_PW:?error}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    read_only: false
    tmpfs:
      - /tmp
      - /run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pclue -d policycluedb"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - backend
    # disable persistence → pure cache, only internal network
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /data
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *policyclue_defaults
    container_name: api
    networks:
      - frontend
      - backend
    entrypoint: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2}"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests, sys; sys.exit(0) if requests.get('http://localhost:8000/docs').ok else sys.exit(1)"]
      interval: 60s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/docs`) || Path(`/openapi.json`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker_sync_hostlists:
    <<: *policyclue_defaults
    container_name: worker_sync_hostlists
    networks:
      - backend
    entrypoint: ["sh", "-c", "python3 worker.py sync_hostlists"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  worker_check_licenseusages:
    <<: *policyclue_defaults
    container_name: worker_check_licenseusages
    networks:
      - backend
    entrypoint: ["sh", "-c", "python3 worker.py check_licenseusages"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  worker_purge_pii:
    <<: *policyclue_defaults
    container_name: worker_purge_pii
    networks:
      - backend
    entrypoint: ["sh", "-c", "python3 worker.py purge_pii"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  worker_send_mailqueue:
    <<: *policyclue_defaults
    container_name: worker_send_mailqueue
    networks:
      - backend
    entrypoint: ["sh", "-c", "python3 worker.py send_mailqueue"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  worker_sync_vulnerabilities:
    <<: *policyclue_defaults
    container_name: worker_sync_vulnerabilities
    restart: "no"
    networks:
      - backend
    entrypoint: ["sh", "-c", "python3 worker.py sync_vulnerabilities"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  worker_scan_attachments:
    <<: *policyclue_defaults
    container_name: worker_scan_attachments
    networks:
      - backend
    entrypoint: ["sh", "-c", "python3 worker.py scan_attachments"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  worker_m365_subscriptions:
    <<: *policyclue_defaults
    container_name: worker_m365_subscriptions
    networks:
      - backend
    entrypoint: ["sh", "-c", "python3 worker.py m365_subscriptions"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  webapp:
    image: registry.khost.ch/policyclue/webapp:latest
    container_name: webapp
    restart: unless-stopped
    networks:
      - frontend
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    healthcheck:
      test: curl --fail http://localhost || exit 1
      interval: 60s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webapp.rule=PathPrefix(`/`)"
      - "traefik.http.routers.webapp.entrypoints=web"
      - "traefik.http.routers.webapp.priority=1"
      - "traefik.http.services.webapp.loadbalancer.server.port=80"

  traefik:
    image: traefik:3
    container_name: traefik
    restart: unless-stopped
    networks:
      - frontend
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
      webapp:
        condition: service_started

volumes:
  postgres-data:
  es-data:
  pclue-files:

networks:
  frontend:
    name: frontend
    driver: bridge
  backend:
    name: backend
    driver: bridge
